# Commands said different ways, in one go with the name: each line says how.
ways:
- Jarvis, could you open YouTube for me
- Jarvis, YouTube (just the word)
- Jarvis, pause (annoyed)
- Jarvis, stop it, stop it (quick)
- Jarvis, uh, what's the time (pausing at uh)
- Jarvis, play something (bored)
- Jarvis, turn it down a bit (quietly)
- Jarvis, louder (calling out)
- Jarvis, skip this song (happy)
- Jarvis, what's on my calendar today (sleepy)
- Jarvis, close Chrome please
- Jarvis, can you mute (whispering)
- Jarvis, never mind
- Jarvis, cancel that (fast)
- Jarvis, open the dashboard (tired)
- Jarvis, any new messages? (asking)
# Timed: it records the whole time, pauses and all. Never say the name in these.
chat:
- Talk with someone in the room for 2 minutes (or a phone call on speaker)
- Talk with someone again, a different topic, for 2 minutes
- Talk to yourself or think out loud for 2 minutes
show:
- Play a series with lots of talking at your normal volume and stay quiet for 3 minutes
- Play a different series or a YouTube video with talking, 3 minutes
- Play a series and chat over it now and then, 3 minutes
- Play music with singing, 3 minutes
