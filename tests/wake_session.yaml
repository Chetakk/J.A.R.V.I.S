talk:
- Say any sentence to yourself, not to JARVIS
- Tell someone in the room what you're doing today
- Ask someone if they've eaten
- Read a line out from your screen
- Talk on the phone as you would (just your side)
- Complain about something, a bit annoyed
- Laugh at something and say why it's funny
