# What `tools/speechtest.py record-wake` asks you to say, for retraining the wake model (tools/wake_train.py).
# Each part is a place in the room; you get time to move there. Recordings: ~/.local/share/jarvis/wake-data/mine.
# Changing a line means recording that line again: each recording is matched to its line by number.
