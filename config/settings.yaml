# JARVIS settings. Edit freely; restart JARVIS to apply.

assistant_name: Jarvis
# Names the assistant answers to: any of these wakes it up (with or without "hey", "hello", "ok"),
# and is stripped from the start of what you say. Add or rename freely.
names: ["jarvis", "ev", "e v", "evie", "eevee"]
# Spoken greeting when it starts: one is picked at random. {daypart} = morning / afternoon / evening.
greeting:
  - "Good {daypart}! I'm up and ready."
  - "Hey, good {daypart}. What can I do for you?"
  - "I'm online. What are we working on today?"
  - "Hi there, ready when you are."
  - "Hey {name}, good {daypart}."
# What JARVIS calls you, now and then ("Done, Chetak."). Remove to never use a name.
user_name: Chetak
# Quiet hours: softer voice (volume in percent) and the shortest version of each reply. hold: heads-ups, habit
# offers and Claude's suggestions wait until they're over (said once you're back). Also by voice: "quiet hours
# from 10 pm to 6 am", "turn off quiet hours" (that wins over this line).
quiet_hours: {enabled: true, start: 23, end: 7, volume: 40, hold: true}
# Heads-ups JARVIS mentions by itself (checked every 2 minutes, each at most every 2 hours; "why did you say
# that" gives the reason, "don't warn me about that again" turns one kind off). Numbers: 0 = off.
heads_up:
  disk: true
  disk_gb: 3          # main disk under this many GB free (or 5 percent)
  battery: true
  cpu: 90             # percent, averaged over the 2 minutes since the last check
  memory: 90          # percent in use
  temperature: 85     # °C, the hottest sensor (the Jetson slows itself down near 100)
# Daily briefing (to-dos, reminders, Day Tracker time and goals): by itself once a day, the first time you're
# around between these hours (not in focus mode or quiet hours). "brief me" any time; also by voice: "turn off
# the daily briefing" (that wins over this line).
briefing: {auto: true, from: 5, until: 12}
# "You usually open VS Code around now. Want me to?" (apps you open at the same hour on 3+ days).
habits: {enabled: true}
wake_word:
  enabled: true
  # whisper: Whisper (GPU) checks each short bit of speech for a name. On the user's own voice it
  #          heard 19 of 21 "EV"/"Jarvis" (with a name hint), and "EV, open YouTube" runs in one go.
  # kws:     small CPU keyword model; lighter, but caught only about 13 of 21 of the same recording.
  engine: whisper
  follow_up_seconds: 8     # whisper only: after an answer, the orb stays lit and you can just talk (0 = off)
  barge_in: named          # whisper only: talking over JARVIS. any = a new request stops it (no name needed
                           # within a minute of your last one), named = only with the name, off = only "stop"
  threshold: 0.10          # kws only: lower = triggers more easily (and more false alarms)
  boost: 2.0               # kws only: higher = favours the wake phrases more

# Starting mode: "agent" (command list, then Claude) or "sys" (command list only).
mode: agent

speech:
  enabled: true
  output_delay: 0.8        # seconds the speaker lags behind (Bluetooth ~0.3-1 s); JARVIS ignores its own echo that long
  engine: piper            # piper | spd-say
  piper_bin: ~/.local/share/jarvis/piper/piper
  # Other fast voices in the same folder: en_GB-jenny_dioco-medium, en_GB-alan-medium,
  # en_GB-northern_english_male-medium, en_US-hfc_male-medium, en_US-joe-medium
  voice: ~/.local/share/jarvis/voices/en_US-lessac-medium.onnx
  length_scale: 1.05       # >1 slower, <1 faster
  noise_scale: 0.75        # more = more expressive (default 0.667)
  noise_w: 0.9             # more = more varied rhythm (default 0.8)
  sentence_silence: 0.25   # pause between sentences, seconds
  # Private mode ("headphones only"): Bluetooth or named headphones when they're connected, else this output
  # (the headphone jack, which can't tell whether anything is plugged in).
  private_sink: alsa_output.platform-sound.analog-stereo
  # Long text read aloud (a card, a window, the clipboard): up to read_words is just said; longer, the start is
  # said and all of it goes on a card ("read the rest", "summarise it"). long_text: summary = Claude sums it
  # up straight away instead (a few seconds slower).
  read_words: 60
  long_text: start

stt:                       # speech-to-text: whisper.cpp server on the GPU
  server_bin: ~/.local/share/jarvis/whisper.cpp/build/bin/whisper-server
  model: ~/.local/share/jarvis/models/ggml-base.en.bin
  port: 8178
  threads: 4

push_to_talk:
  key: right_ctrl
  # When one of these windows is focused, the key is left to that app instead of JARVIS
  # (e.g. Claude Code's own voice input inside VS Code). Case-insensitive match on the window class
  # (VS Code is "com.microsoft.VSCode").
  pass_through_windows: ["vscode"]
  # Same, matched against the window title: Claude Code in a terminal and Claude chats in the browser.
  pass_through_titles: ["claude"]

# Browser agent (skills/web.py): its own Chrome with its own profile (~/.local/share/jarvis/agent-chrome), run by
# tools/browser-agent (npm install there once). It starts when needed and closes after idle_minutes.
browser_agent:
  idle_minutes: 10
  timeout: 60              # seconds one page may take
  chrome: /opt/google/chrome/chrome

claude:                    # phase 2
  model: claude-haiku-5-5
  effort: low              # low | medium | high (thinking is off either way, for speed)
  new_after_minutes: 20    # start a fresh conversation after this long without a question
  suggest_every_minutes: 10  # at most one of Claude's own suggestions this often
  fix_model: claude-sonnet-5-5  # for Claude Code fixing JARVIS's own code ("fix ... in jarvis")

ui:
  enabled: true            # transparent orb + top-right tray icon
  orb: auto                # auto = appears while you're talking to it, fades after; true = always; false = never
  orb_hide_after: 4        # seconds of quiet before the orb hides (auto mode)
  card_hide_after: 30      # with a card open, orb and card hide together after this many quiet seconds
  chat: false              # show the chat panel at startup (click the orb, or say "show chat")
  show_hearing: true       # list everything speech recognition hears in the chat ("hide what you hear" to stop)

workspace:
  enabled: true            # new windows JARVIS opens go to this workspace, and it takes you there
  number: 5

# Seconds to wait for a yes/no before cancelling a "confirm" command.
confirm_timeout: 8

# Terminal used for "manual" commands. {script} is replaced by the JARVIS terminal script.
terminal: 'gnome-terminal --title "JARVIS: manual commands" -- {script}'

# Jetson Nano ("EV, is the Nano up?", "restart the Nano link", "run uptime on the Nano").
nano:
  host: 192.168.50.10
  user: biztel-nano
  key: ~/.ssh/boisys_nano
  service: nano-kvm.service

# Meaning matcher (config/intents.yaml): how close (0-1) another wording must be to run a known phrase.
intents:
  threshold: 0.72

# Watchdog (system/watchdog.py): restarts what hangs. Memory use is logged every 10 minutes.
# Tasks: requests that take several steps, each one checked (skills/tasks.py). "continue the task" after a pause.
agent:
  max_steps: 12       # a longer plan is offered to Claude Code in a terminal instead
  ask_over_steps: 4   # more steps than this: asked "shall I go ahead?" first (risky steps always are)
  retries: 1          # a failed step that's safe to repeat is tried this many more times, then you're asked
  max_rounds: 4       # times Claude may plan again in one task (after a step that needs it, or a failure)
  step_timeout: 300   # seconds a shell step may take
  big_model: claude-sonnet-5-5  # Claude Code model when a task is handed over

watchdog:
  stuck_minutes: 10   # a request running longer than this restarts JARVIS
  jarvis_mb: 1500     # JARVIS restarts itself (when idle) above this
  whisper_mb: 2500    # whisper-server is restarted above this

# When Claude turns something you said into one of JARVIS's own phrases, learn that wording so it works
# without Claude next time (core/learned.py, ~/.local/share/jarvis/learned.yaml).
# ask = ask first ("Should I remember that ... means ...?"), quiet = just learn it, off = never.
learn: ask
