# Meaning matcher (core/intent.py): when nothing else matches, a request that MEANS one of these
# phrases runs it. Key = a phrase JARVIS already understands; list = other ways of saying it.
# Only phrases without names/values in them. Add lines here when JARVIS misses something.
pause the music: [kill the music, shut the song up, hold the video, stop the song for a sec, mute the music]
play the music: [put the music back on, start the song again, carry on playing, let it play]
next song: [skip this one, i don't like this song, change the song, play something else, play the next song, play the next track, next one please]
previous song: [play the one before, go back to the last song, replay the previous track, play the last song again, play the previous song, go back to the previous track]
what's playing: [what am i hearing, which song is this, name this song, who sings this]
close this tab: [get rid of this tab, kill this tab, shut this tab]
new tab: [give me a blank tab, start a fresh tab]
reopen the last tab: [i closed that tab by mistake, bring that tab back, undo closing the tab]
go back: [take me back, back to the previous page, return to the last page]
reload the page: [this page is stuck, page won't load, refresh this]
scroll down: [move down, show me more, keep going down]
scroll up: [move up, go up a bit]
zoom in: [make it bigger, i can't read this, bigger text]
zoom out: [make it smaller, smaller text, too big]
close this window: [get rid of this window, shut this window]
maximise: [make this window full size, fill the screen, make it fullscreen]
minimise: [hide this window, get this window out of the way]
what's on my screen: [can you see this, look at this, what's this error about, help me with what's on screen]
what's on my clipboard: [what did i copy, read what i copied, what have i got copied]
list my notes: [what have i asked you to remember, what's in my notes]
what's pending: [what's left to do, anything i need to do, what am i forgetting, my to do list]
status: [how are you running, system check, are you okay, health check, how are your systems]
what's running: [which projects are up, what's running right now, anything running, which projects are running, is anything running right now, are any projects running, what's up and running]
stop all projects: [shut down every project, kill all the projects, stop everything that's running]
list my projects: [what projects do i have, show me my projects, which projects are there]
open claude: [i want to talk to claude, bring up claude code, start claude]
show chat: [open the chat, show me the conversation, show the chat window]
hide chat: [close the chat, get rid of the chat, hide the conversation]
close the card: [close it, get rid of that card, hide the card, dismiss that]
# Saved commands (config/commands.yaml) are added automatically; extra wordings for them go here too.
volume up: [turn the sound up, make it louder, i can't hear it, raise the volume]
volume down: [turn the sound down, make it quieter, it's too loud, lower the volume]
dark mode: [make everything dark, switch to the dark look, my eyes hurt]
# With a {value}: other wordings are matched word for word, and the value is carried over.
"close {app}": ["shut {app}", "exit {app}", "get rid of {app}", "stop {app} app", "close down {app}", "shut {app} down"]
"set volume to {level}": ["make it {level} percent", "volume at {level}", "put the volume at {level}", "turn the volume to {level}", "volume to {level} percent", "set the sound to {level}", "set the volume to {level}", "volume to {level}", "change the volume to {level}", "make the volume {level}"]
"connect to wifi {network}": ["join {network} wifi", "get on {network} wifi", "use the {network} network", "switch to {network} wifi"]

