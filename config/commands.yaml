# JARVIS command list.
#
# Each command:
#   name:    unique id
#   say:     phrases that trigger it; {slot} captures part of what you said
#   run:     shell command; slot values are shell-quoted before they are inserted
#   reply:   what JARVIS says back (or a list, one picked at random); may use slots and {output}
#   ask:     optional yes/no question for confirm-level commands; may use slots
#   output:  true = capture the command's output (for {output} and printing)
#   risk:    optional auto / confirm / manual; can only make safety.yaml stricter
#   window:  true = opens a new app window, so JARVIS goes to its workspace first
#   process: process name for "close it" after opening (default: the program's name; "" = can't close)
#
# Browser phrases ("open youtube in chrome", "search youtube for X", "open my work tabs")
# are built in and use the browsers / sites / tab_groups sections below.

browsers:
  chrome:  {run: google-chrome, new_window: --new-window, desktop: com.google.Chrome.desktop, process: chrome,
            aliases: [chrome, google chrome]}
  firefox: {run: firefox, new_window: --new-window, desktop: firefox.desktop, aliases: [firefox, mozilla, mozilla firefox]}

# A site: url, and optionally search ({q}), title (as said back), aliases, pages ("open my youtube playlists",
# "open claude new chat"; {me} = your account), my (the page for "open my <site>"), channel ("open <name> on kick"),
# repos / repo_pages (GitHub), app: true (the installed app wins unless a browser is named: "open discord in chrome").
# Your accounts, channels, shows and repos go in ~/.local/share/jarvis/sites.yaml, in the same shape.
sites:
  google:   {url: "https://www.google.com", search: "https://www.google.com/search?q={q}"}
  youtube:
    url: "https://www.youtube.com"
    title: YouTube
    aliases: [yt, you tube, tube]
    search: "https://www.youtube.com/results?search_query={q}"
    pages: {playlists: feed/playlists, history: feed/history, watch history: feed/history,
            subscriptions: feed/subscriptions, watch later: "playlist?list=WL", liked videos: "playlist?list=LL",
            shorts: shorts, liked: "playlist?list=LL", videos i liked: "playlist?list=LL",
            subscribed: feed/subscriptions}
  gmail:    {url: "https://mail.google.com", aliases: [google mail, gmails, mail, mails, email, emails, e-mail, e-mails]}
  github:
    url: "https://github.com"
    title: GitHub
    search: "https://github.com/search?q={q}"
    my: profile
    pages: {profile: "{me}", repos: "{me}?tab=repositories", repositories: "{me}?tab=repositories",
            stars: "{me}?tab=stars", starred: "{me}?tab=stars", starred repos: "{me}?tab=stars",
            notifications: notifications, pull requests: pulls, prs: pulls, open prs: pulls,
            open pull requests: pulls, issues: issues, new repo: new, new repository: new}
    repo_pages: {pull requests: pulls, prs: pulls, pulls: pulls, issues: issues, actions: actions,
                 workflows: actions, settings: settings, commits: commits, branches: branches, releases: releases}
  chatgpt:  {url: "https://chatgpt.com", title: ChatGPT, aliases: [chat gpt, open ai, openai]}
  claude:
    url: "https://claude.ai"
    aliases: [claude ai]
    pages: {new chat: new, new: new, fresh chat: new, conversation: new, new conversation: new, chats: recents,
            recents: recents, recent chats: recents, history: recents, projects: projects}
  claude code: {url: "https://claude.ai/code"}
  whatsapp: {url: "https://web.whatsapp.com", title: WhatsApp, aliases: [whatsapp web]}
  maps:     {url: "https://maps.google.com", aliases: [google maps, map], search: "https://www.google.com/maps/search/{q}"}
  wikipedia: {url: "https://en.wikipedia.org", aliases: [wiki], search: "https://en.wikipedia.org/w/index.php?search={q}"}
  amazon:   {url: "https://www.amazon.in", aliases: [amazon india], search: "https://www.amazon.in/s?k={q}"}
  spotify:  {url: "https://open.spotify.com"}
  linkedin:
    url: "https://www.linkedin.com"
    title: LinkedIn
    aliases: [linked in]
    search: "https://www.linkedin.com/search/results/all/?keywords={q}"
    my: profile
    pages: {profile: in/me/, jobs: jobs/, job search: jobs/, messages: messaging/, inbox: messaging/,
            notifications: notifications/, network: mynetwork/, connections: mynetwork/}
  linkedin jobs: {url: "https://www.linkedin.com/jobs/", title: LinkedIn jobs,
                  search: "https://www.linkedin.com/jobs/search/?keywords={q}"}
  hotstar:
    url: "https://www.hotstar.com/in/home"
    aliases: [jiohotstar, jio hotstar, hot star, disney hotstar, jio cinema hotstar]
    search: "https://www.hotstar.com/in/explore?search_query={q}"
    pages: {my space: in/mypage, watchlist: in/mypage, list: in/mypage, saved shows: in/mypage}
  kick:
    url: "https://kick.com"
    search: "https://kick.com/search?query={q}"
    channel: "https://kick.com/{name}"
    pages: {events: events, live events: events/browse/live, live: events/browse/live, drops: drops/campaigns}
  twitch:
    url: "https://www.twitch.tv"
    aliases: [twitch tv]
    search: "https://www.twitch.tv/search?term={q}"
    channel: "https://www.twitch.tv/{name}"
  x:
    url: "https://x.com/home"
    title: X
    aliases: [twitter]
    search: "https://x.com/search?q={q}"
    pages: {home: home, feed: home, notifications: notifications, messages: messages, dms: messages,
            bookmarks: i/bookmarks, saved tweets: i/bookmarks, explore: explore, trending: explore}
  instagram:
    url: "https://www.instagram.com"
    aliases: [insta, ig, gram]
    search: "https://www.instagram.com/explore/search/keyword/?q={q}"
    pages: {messages: direct/inbox, dms: direct/inbox, inbox: direct/inbox, reels: reels, explore: explore}
  discord:
    url: "https://discord.com/channels/@me"
    aliases: [discord web]
    app: true
    pages: {messages: channels/@me, dms: channels/@me, friends: channels/@me}
  google drive: {url: "https://drive.google.com", aliases: [my drive, drive], search: "https://drive.google.com/drive/search?q={q}"}
  google docs: {url: "https://docs.google.com/document/", aliases: [docs]}
  google sheets: {url: "https://docs.google.com/spreadsheets/", aliases: [sheets]}
  google calendar: {url: "https://calendar.google.com"}
  google meet: {url: "https://meet.google.com", aliases: [meet]}
  google chat: {url: "https://chat.google.com"}
  google cloud: {url: "https://console.cloud.google.com", aliases: [google cloud console, gcp, cloud console, google console]}
  vercel:   {url: "https://vercel.com/dashboard"}
  supabase: {url: "https://supabase.com/dashboard"}
  tailscale: {url: "https://login.tailscale.com/admin"}
  hugging face: {url: "https://huggingface.co", aliases: [huggingface, hugging], search: "https://huggingface.co/search/full-text?q={q}"}
  kaggle:   {url: "https://www.kaggle.com", search: "https://www.kaggle.com/search?q={q}"}
  overleaf: {url: "https://www.overleaf.com/project"}
  zepto:    {url: "https://www.zepto.com", search: "https://www.zepto.com/search?query={q}"}
  instamart: {url: "https://instamart.swiggy.com/instamart", aliases: [swiggy instamart, swiggy], search: "https://instamart.swiggy.com/instamart/search?custom_back=true&query={q}"}
  moctale:  {url: "https://www.moctale.in/discover"}
  capcut:   {url: "https://www.capcut.com", aliases: [cap cut]}
  roblox:   {url: "https://www.roblox.com"}

tab_groups:
  work:  [gmail, github]
  music: [youtube, spotify]

commands:
  # --- apps ---
  - name: open_terminal
    say: [open terminal, launch terminal, new terminal]
    run: gnome-terminal
    window: true
    process: ""
    reply: ["Opening a terminal", "Terminal coming up", "A terminal, as requested", "Terminal's up", "Here's your terminal"]

  - name: open_files
    say: [open files, open file manager, open home folder, open nautilus]
    run: nautilus ~
    window: true
    reply: ["Opening your files", "Here are your files", "Your files, coming up", "Opening the file manager"]

  - name: open_downloads
    say: [open downloads, open downloads folder, show downloads]
    run: xdg-open ~/Downloads
    window: true
    process: ""
    reply: ["Opening your Downloads", "Accessing Downloads", "Here are your Downloads", "Downloads coming up"]

  - name: open_documents
    say: [open documents, open documents folder]
    run: xdg-open ~/Documents
    window: true
    process: ""
    reply: ["Opening your Documents", "Accessing Documents", "Here are your Documents", "Documents coming up"]

  - name: open_desktop_folder
    say: [open desktop folder]
    run: xdg-open ~/Desktop
    window: true
    process: ""
    reply: ["Opening the Desktop folder", "Here's your Desktop folder", "Opening your Desktop folder", "Desktop folder coming up"]

  - name: open_pictures
    say: [open pictures, open pictures folder, open screenshots]
    run: xdg-open ~/Pictures
    window: true
    process: ""
    reply: ["Opening your Pictures", "Accessing your pictures", "Here are your pictures", "Pictures coming up"]

  - name: open_vscode
    say: [open vs code, open vscode, open code editor, launch vs code]
    run: code
    window: true
    reply: ["Opening VS Code", "VS Code coming up. Working on a secret project, are we?", "VS Code, ready for work", "Opening VS Code. Let's build something"]

  - name: open_chrome
    say: [open chrome, launch chrome, open google chrome]
    run: google-chrome
    window: true
    process: chrome
    reply: ["Opening Chrome", "Chrome coming up", "Chrome, on its way", "Launching Chrome"]

  - name: open_firefox
    say: [open firefox, launch firefox]
    run: firefox
    window: true
    reply: ["Opening Firefox", "Firefox coming up", "Firefox, on its way", "Launching Firefox"]

  - name: open_settings
    say: [open settings, open system settings]
    run: gnome-control-center
    window: true
    reply: ["Opening settings", "Accessing settings", "Settings coming up", "Here are your settings"]

  - name: open_calculator
    say: [open calculator, calculator]
    run: gnome-calculator
    window: true
    reply: ["Opening the calculator", "The calculator. Though you could just ask me", "Calculator coming up", "The calculator. I do maths too, you know"]

  - name: open_text_editor
    say: [open text editor, open gedit, open notepad]
    run: gedit
    window: true
    reply: ["Opening the text editor", "A blank page, ready when you are", "Text editor coming up", "Opening a fresh page"]

  - name: open_system_monitor
    say: [open system monitor, open task manager]
    run: gnome-system-monitor
    window: true
    reply: ["Opening the system monitor", "Let's see what's running", "System monitor coming up", "Let's have a look under the hood"]

  - name: close_app
    say: ["close {app}", "quit {app}", "kill {app}"]
    run: "pkill -x {app}"
    reply: ["Closed {app}", "{app} is closed", "Closed {app} for you", "{app} is gone"]
    ask: "Close {app}? Anything unsaved will be lost."

  # --- sound ---
  - name: volume_up
    say: [volume up, increase volume, louder, turn it up]
    run: pactl set-sink-volume @DEFAULT_SINK@ +10%
    reply: ["Louder", "Turning it up", "Very good", "A bit louder", "Up it goes"]

  - name: volume_down
    say: [volume down, decrease volume, quieter, turn it down]
    run: pactl set-sink-volume @DEFAULT_SINK@ -10%
    reply: ["Quieter", "Turning it down", "Very good", "A bit softer", "Down it goes"]

  - name: set_volume
    say: ["set volume to {level}", "volume {level}", "set volume to {level} percent"]
    run: "pactl set-sink-volume @DEFAULT_SINK@ {level}%"
    reply: ["Volume at {level} percent", "{level} percent it is", "Volume set to {level} percent", "Setting it to {level} percent"]

  # Muting lives in skills/audio.py, not here: "mute the sound" / "unmute the sound" / "mute the mic" each go
  # one way only (a toggle turned "unmute" into "mute" whenever nothing was muted), the mic asks first, and the
  # tray icon shows what's muted. Unmuting the mic is the tray icon's job: by then JARVIS can't hear you.

  # --- screen ---
  - name: screenshot
    say: [take a screenshot, take screenshot, screenshot]
    run: gnome-screenshot
    reply: ["Screenshot taken, it's in Pictures", "Captured. It's in Pictures", "Got it. It's in Pictures", "Screenshot saved in Pictures"]

  - name: screenshot_clipboard
    say: [take a screenshot and copy it to my clipboard, take a screenshot and copy it to the clipboard,
          take a screenshot and copy it, screenshot to clipboard, screenshot to my clipboard, copy a screenshot,
          copy a screenshot to my clipboard, screenshot and copy it, take a screenshot to my clipboard]
    run: gnome-screenshot -c
    reply: ["Screenshot's on your clipboard", "Captured and copied. Paste away", "On your clipboard. Ready to paste"]

  - name: screenshot_area
    say: [screenshot area, screenshot a region, take a screenshot of an area]
    run: gnome-screenshot -a
    reply: ["Drag to select the area", "Pick the area, I'll capture it", "Select the area to capture", "Draw a box around what you want"]

  - name: lock_screen
    say: [lock screen, lock the screen, lock my computer]
    run: loginctl lock-session
    reply: ["Locking the screen", "Locking up. I'll keep watch", "Screen locked", "Locking it. Nobody gets in"]
    ask: "Lock the screen now?"

  - name: screenshot_window
    say: [screenshot window, screenshot this window, take a screenshot of the window]
    run: gnome-screenshot -w
    reply: ["Window captured, it's in Pictures", "Window screenshot saved in Pictures", "Got the window. It's in Pictures"]

  # Brightness is software dimming (xrandr): the HDMI monitor has no backlight control here.
  - name: brightness_full
    say: [brightness full, full brightness, max brightness, brightness 100]
    run: xrandr --output HDMI-0 --brightness 1.0
    reply: ["Full brightness", "Brightness at maximum", "Brightness all the way up", "Full brightness. Sunglasses optional"]

  - name: brightness_high
    say: [brightness high, brightness 80]
    run: xrandr --output HDMI-0 --brightness 0.8
    reply: "Brightness at 80 percent"

  - name: brightness_medium
    say: [brightness medium, brightness half, half brightness, brightness 60]
    run: xrandr --output HDMI-0 --brightness 0.6
    reply: ["Brightness at 60 percent", "Brightness set to 60 percent", "60 percent brightness"]

  - name: brightness_low
    say: [brightness low, dim the screen, low brightness, brightness 40]
    run: xrandr --output HDMI-0 --brightness 0.4
    reply: ["Dimming the screen", "Brightness at 40 percent", "Turning the brightness down", "Brightness down to 40 percent"]

  - name: night_light_on
    say: [night light on, turn on night light, enable night light]
    run: >-
      gsettings set org.gnome.settings-daemon.plugins.color night-light-schedule-automatic false &&
      gsettings set org.gnome.settings-daemon.plugins.color night-light-schedule-from 0.0 &&
      gsettings set org.gnome.settings-daemon.plugins.color night-light-schedule-to 23.99 &&
      gsettings set org.gnome.settings-daemon.plugins.color night-light-enabled true
    reply: ["Night light is on", "Warming up the display. Easier on the eyes", "Night light on. Kinder to your eyes"]

  - name: night_light_off
    say: [night light off, turn off night light, disable night light]
    run: gsettings set org.gnome.settings-daemon.plugins.color night-light-enabled false
    reply: ["Night light is off", "Night light off", "Back to normal colours"]

  - name: dark_mode
    say: [dark mode, dark theme, turn on dark mode]
    run: gsettings set org.gnome.desktop.interface gtk-theme Nordic
    reply: ["Dark mode on", "Going dark", "Dark mode it is", "Switching to the dark side"]

  - name: light_mode
    say: [light mode, light theme, turn off dark mode]
    run: gsettings set org.gnome.desktop.interface gtk-theme Yaru-light
    reply: ["Light mode on", "Light mode it is", "Back to the light"]

  - name: text_bigger
    say: [bigger text, make text bigger, increase text size, large text]
    run: gsettings set org.gnome.desktop.interface text-scaling-factor 1.25
    reply: ["Text is bigger now", "Made the text bigger", "Bigger text, coming up"]

  - name: text_normal
    say: [normal text, normal text size, reset text size]
    run: gsettings set org.gnome.desktop.interface text-scaling-factor 1.0
    reply: ["Text size is back to normal", "Text is back to its usual size", "Normal text size again"]

  - name: screen_off
    say: [screen off, turn off the screen, turn off display]
    run: xset dpms force off
    reply: ["Display off. Move the mouse to wake it", "Turning off the display", "Screen off. Move the mouse when you need it"]

  - name: rotate_normal
    say: [rotate screen normal, reset screen rotation]
    run: xrandr --output HDMI-0 --rotate normal
    reply: ["Screen rotation reset", "The screen's the right way up again", "Rotation back to normal"]

  - name: rotate_left
    say: [rotate screen left, portrait mode]
    run: xrandr --output HDMI-0 --rotate left
    risk: confirm
    ask: "Rotate the screen? Say rotate screen normal to undo."
    reply: ["Rotated the screen", "Screen rotated", "Turned the screen"]

  - name: dnd_on
    say: [do not disturb, do not disturb on, turn on do not disturb, mute notifications]
    run: gsettings set org.gnome.desktop.notifications show-banners false
    reply: ["Do not disturb is on. I'll hold your calls", "Notifications muted", "Do not disturb is on. Nobody gets through", "Quiet mode on. I'll keep the notifications back"]

  - name: dnd_off
    say: [do not disturb off, turn off do not disturb, unmute notifications]
    run: gsettings set org.gnome.desktop.notifications show-banners true
    reply: ["Notifications are back on", "You're reachable again", "Do not disturb is off", "Notifications are on again"]

  # --- wifi & network ---
  - name: wifi_on
    say: [wifi on, turn on wifi, enable wifi]
    run: nmcli radio wifi on
    reply: ["Wi-Fi is on", "Activating Wi-Fi", "Turning Wi-Fi on", "Wi-Fi is back on"]

  - name: wifi_off
    say: [wifi off, turn off wifi, disable wifi]
    run: nmcli radio wifi off
    risk: confirm
    ask: "Turn Wi-Fi off? You'll lose internet unless the cable is plugged in."
    reply: ["Wi-Fi is off", "Turning Wi-Fi off", "Wi-Fi's off now"]

  - name: wifi_status
    say: [which wifi am i on, what wifi am i connected to, wifi status, current wifi]
    run: "nmcli -t -f active,ssid dev wifi | awk -F: '$1==\"yes\"{print $2}'"
    output: true
    reply: ["You're on {output}", "Connected to {output}"]

  - name: wifi_list
    say: [list wifi networks, scan wifi, show wifi networks, what wifi networks are there]
    run: "nmcli -t -f SSID dev wifi list | awk 'NF && !seen[$0]++' | head -5 | paste -sd,"
    output: true
    reply: "I can see {output}"

  - name: wifi_connect
    say: ["connect to wifi {network}", "connect wifi {network}", "switch wifi to {network}"]
    run: "nmcli con up id {network}"
    reply: ["Connecting to {network}", "Switching to {network}", "Joining {network}"]

  - name: wifi_disconnect
    say: [disconnect wifi, disconnect from wifi]
    run: nmcli dev disconnect wlan0
    risk: confirm
    ask: "Disconnect from Wi-Fi?"
    reply: ["Disconnected from Wi-Fi", "Disconnected", "Off the Wi-Fi now"]

  - name: hotspot_on
    say: [hotspot on, turn on hotspot, start hotspot]
    run: nmcli dev wifi hotspot ifname wlan0 ssid Jarvis password jarvis1234
    risk: confirm
    ask: "Start a hotspot? This drops your current Wi-Fi connection."
    reply: ["Hotspot Jarvis is on, password jarvis 1 2 3 4", "Hotspot's up. It's called Jarvis, password jarvis 1 2 3 4"]

  - name: hotspot_off
    say: [hotspot off, turn off hotspot, stop hotspot]
    run: nmcli con down Hotspot
    reply: ["Hotspot is off", "Hotspot's off", "Turned off the hotspot"]

  - name: airplane_on
    say: [airplane mode, airplane mode on, flight mode]
    run: nmcli radio all off
    risk: confirm
    ask: "Airplane mode turns off Wi-Fi, and the Echo Dot may drop too. Go ahead?"
    reply: ["Airplane mode on", "Airplane mode is on. All radios off", "Going offline. Airplane mode on"]

  - name: airplane_off
    say: [airplane mode off, turn off airplane mode, flight mode off]
    run: nmcli radio all on
    reply: ["Airplane mode off, radios are back on", "Airplane mode is off", "Radios back on. Airplane mode off"]

  - name: internet_check
    say: [am i online, check internet, is the internet working, internet status]
    run: ping -c2 -W2 8.8.8.8 >/dev/null 2>&1 && echo online || echo offline
    output: true
    reply: ["You're {output}", "Looks like you're {output}"]

  # --- bluetooth ---
  - name: bluetooth_on
    say: [bluetooth on, turn on bluetooth, enable bluetooth]
    run: bluetoothctl power on
    reply: ["Bluetooth is on", "Turning Bluetooth on", "Bluetooth's on"]

  - name: bluetooth_off
    say: [bluetooth off, turn off bluetooth, disable bluetooth]
    run: bluetoothctl power off
    risk: confirm
    ask: "Turn Bluetooth off? The Echo Dot will disconnect and I'll go quiet."
    reply: ["Bluetooth is off", "Turning Bluetooth off", "Bluetooth's off"]

  - name: bluetooth_devices
    say: [bluetooth devices, paired devices, list bluetooth devices, show bluetooth devices]
    run: "bluetoothctl paired-devices | cut -d' ' -f3- | paste -sd,"
    output: true
    reply: "Paired devices: {output}"

  # --- contributions ---
  - name: contrib_sync
    say: [sync contributions, sync my contributions, sync github contributions, sync my github contributions,
          mirror contributions, mirror my contributions, mirror work contributions, update contributions,
          update my contributions, run contrib sync, start contrib sync, sync my work contributions]
    run: systemctl --user start --no-block contrib-sync.service
    reply: ["Syncing your work contributions", "Mirroring your GitHub contributions now", "Syncing your GitHub contributions"]

  # --- power ---
  - name: shutdown
    say: [shut down, shutdown, power off, turn off the computer]
    run: systemctl poweroff
    reply: ["Shutting systems down. Goodbye", "Powering down. Until next time", "Shutting down. Goodbye for now", "Powering off. Take care"]
    ask: "Are you sure you want me to shut down?"

  - name: reboot
    say: [reboot, restart, restart the computer]
    run: systemctl reboot
    reply: ["Restarting. Back in a moment", "Rebooting. Don't go anywhere", "Restarting. I'll be right back", "See you on the other side of a reboot"]
    ask: "Restart the computer now?"

  - name: suspend
    say: [suspend, sleep, go to sleep]
    run: systemctl suspend
    reply: ["Going to sleep. Wake me when you need me", "Powering down to standby", "Off to sleep. Wake me when you need me", "Standing by in sleep mode"]
    ask: "Put the computer to sleep?"

  - name: log_out
    say: [log out, sign out, log me out]
    run: gnome-session-quit --logout --no-prompt
    risk: confirm
    ask: "Log out now? Unsaved work will be lost."
    reply: ["Logging out", "Logging you out", "Signing you out. See you soon"]

  - name: power_mode
    say: [power mode, what power mode, which power mode, current power mode]
    run: "nvpmodel -q 2>/dev/null | head -1 | cut -d: -f2"
    output: true
    reply: "You're in {output} mode"

  # These need sudo, so they always go to the terminal for you to run.
  - name: power_max
    say: [max power mode, maxn mode, full power mode]
    run: sudo nvpmodel -m 0
    reply: ["Switching to max power", "All power to the main systems", "Max power mode. Full speed ahead"]

  - name: power_low
    say: [low power mode, power saving mode, 10 watt mode]
    run: sudo nvpmodel -m 1
    reply: ["Switching to 10 watt mode", "10 watt mode. Saving power", "Easing off to 10 watts"]

  - name: power_normal
    say: [normal power mode, 25 watt mode]
    run: sudo nvpmodel -m 3
    reply: ["Switching to 25 watt mode", "25 watt mode", "Back to 25 watts"]

  - name: jetson_clocks
    say: [max performance, boost clocks, jetson clocks, full speed]
    run: sudo jetson_clocks
    reply: ["Clocks maxed", "Clocks at full speed. Try not to melt anything", "Clocks at maximum. Full speed"]

  - name: fan_max
    say: [fan max, fan full speed, cool down]
    run: sudo jetson_clocks --fan
    reply: ["Fan at full speed", "Fan's at full blast", "Maximum cooling"]

  # --- info ---
  - name: time
    say: [what time is it, time, tell me the time, what's the time]
    run: date '+%-I:%M %p'
    output: true
    reply: ["It's {output}", "The time is {output}"]

  - name: date
    say: [what's the date, what is the date, today's date, what day is it]
    run: date '+%A, %-d %B %Y'
    output: true
    reply: ["Today is {output}", "It's {output}"]

  - name: disk_space
    say: [disk space, check disk space, how much space is left, free space]
    run: df -h / --output=avail | tail -1
    output: true
    reply: ["You've got {output} free on the main disk", "There's {output} left on the main disk"]

  - name: memory
    say: [memory usage, how much memory, ram usage, check memory]
    run: free -h | awk '/Mem/ {print $7}'
    output: true
    reply: ["You've got {output} of memory free", "{output} of memory available"]

  - name: ip_address
    say: [ip address, what's my ip, what is my ip address]
    run: hostname -I | cut -d' ' -f1
    output: true
    reply: ["Your IP address is {output}", "You're on {output}"]

  - name: uptime
    say: [uptime, how long has the computer been on]
    run: uptime -p
    output: true
    reply: "The computer's been {output}"

  - name: cpu_temp
    say: [temperature, cpu temperature, how hot is it, how hot is the computer]
    run: "awk '{printf \"%d degrees\", $1/1000}' /sys/class/thermal/thermal_zone0/temp"
    output: true
    reply: ["The CPU is at {output}", "CPU temperature is {output}"]

  - name: gpu_temp
    say: [gpu temperature, how hot is the gpu]
    run: "awk '{printf \"%d degrees\", $1/1000}' /sys/class/thermal/thermal_zone1/temp"
    output: true
    reply: "The GPU is at {output}"

  - name: cpu_usage
    say: [cpu usage, how busy is the cpu, processor usage]
    run: "top -bn1 | awk '/Cpu\\(s\\)/ {printf \"%d percent\", 100-$8}'"
    output: true
    reply: "The CPU is at {output}"

  - name: timezone
    say: [what's my time zone, time zone, which time zone]
    run: timedatectl show -p Timezone --value
    output: true
    reply: "Your time zone is {output}"

  - name: computer_name
    say: [computer name, what's the computer name, hostname]
    run: hostname
    output: true
    reply: "This computer is called {output}"

  # --- files ---
  - name: open_trash
    say: [open trash, show trash, open recycle bin]
    run: nautilus trash:///
    window: true
    reply: ["Here's the trash", "Opening the trash", "The trash, as requested"]

  - name: empty_trash
    say: [empty trash, empty the trash, empty recycle bin]
    run: gio trash --empty
    risk: confirm
    ask: "Empty the trash? Those files will be gone for good."
    reply: ["Trash emptied", "The trash has been taken out. Among my many duties", "The trash is empty now", "All cleared out"]

  - name: peripheral_battery
    say: [mouse battery, keyboard battery, how is my mouse battery]
    run: upower --dump | grep -E -i "model|percentage|state"
    reply: Here is what I found for your devices.
    output: true

  - name: run_study_buddy
    say: [run study buddy, start study buddy, run the study app]
    run: curl -s -o /dev/null http://127.0.0.1:7314 || npm --prefix /home/biztelai/Projects/study-budd run dev
    reply: ["Running Study Buddy.", "Starting Study Buddy.", "Study Buddy, coming up."]

  - name: focused_window
    say: [what window am i on, what window are we focused on, which window is focused, check what window
        we are focused on]
    run: xdotool getactivewindow getwindowname
    reply: You're on {output}.
    output: true

  - name: open_projects_folder
    say: ['open {folder} in projects', 'open my {folder} project folder', 'open the {folder} folder in projects']
    run: xdg-open /home/biztelai/Projects/{folder}
    reply: ["Opening {folder}.", "Here's {folder}.", "{folder}, coming up."]

  - name: are_you_back
    say: [are you back, you back, i said are you back]
    run: echo Jarvis is back
    reply: ["At your service. What can I do for you?", "Yes, I'm back. Systems fully operational", "Right here, and fully operational", "Back and ready"]

