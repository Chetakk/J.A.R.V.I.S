# Chat replies (core/chat.py): things people say to JARVIS that aren't a request, and its own answers.
# A wording is matched by meaning (the MiniLM model), so it needn't be said word for word.
# Most wordings are user messages from HumanLLMs/Human-Like-DPO-Dataset (only the prompts, not its answers).
# Replies: {name} = your name, {me} = JARVIS's name. Rebuilt from the topics list; edit the replies freely.
